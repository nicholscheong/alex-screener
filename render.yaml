# Render Blueprint (方案 B). Push this folder to GitHub, then on render.com:
# New → Blueprint → pick the repo. It reads this file.
# After the first deploy, set ALEX_TOKEN in the service's Environment tab to a
# secret string, then open the app once as  https://<app>.onrender.com/?key=<token>
services:
  - type: web
    name: alex-screener
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ALEX_TOKEN
        sync: false
