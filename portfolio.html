<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<title>Alex</title>
<style>
  :root{
    --bg:#0a0c11; --bg1:#0e1116; --bg2:#12151c; --bg3:#181c25; --bg-hover:#14171f;
    --line:#1f2531; --line2:#171b23; --line-strong:#2b3340;
    --fg:#e8ebf1; --fg2:#98a1b3; --fg3:#5f6a7d; --fg-mute:#3f4959;
    --accent:#5b93f6; --accent-fg:#d7e6ff; --accent-bg:#16233c; --accent-line:#31496f;
    --up:#26b58e; --down:#f05f6b; --flat:#7a8698;
    --up-bg:rgba(38,181,142,.14); --down-bg:rgba(240,95,107,.14);
    --r-sm:4px; --r:6px; --r-lg:10px;
    --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --mono:"Cascadia Code","Cascadia Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased;
       display:flex;flex-direction:column;min-height:100%;font-variant-numeric:tabular-nums}
  header{display:flex;align-items:center;gap:9px;height:52px;padding:0 20px;background:var(--bg1);border-bottom:1px solid var(--line);flex:none}
  .logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:650;letter-spacing:-.01em;color:var(--fg);text-decoration:none}
  .logo::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px -1px var(--accent)}
  .logo small{font:600 9.5px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin-left:2px}
  .grow{flex:1}
  .btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;background:var(--bg3);border:1px solid var(--line);color:var(--fg2);border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;text-decoration:none}
  .btn:hover{color:var(--fg);border-color:var(--line-strong);background:var(--bg2)}

  main{flex:1;padding:32px 24px;max-width:980px;width:100%;margin:0 auto}
  h1{margin:0 0 6px;font-size:21px;font-weight:650;letter-spacing:-.01em}
  .sub{margin:0 0 26px;color:var(--fg2);font-size:13px;line-height:1.5;max-width:640px}
  .badge-local{display:inline-flex;align-items:center;gap:5px;font:600 9.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);border:1px solid var(--line);border-radius:999px;padding:3px 9px;margin-left:8px;vertical-align:2px}

  .setup{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;max-width:640px}
  .setup h2{margin:0 0 10px;font-size:14px}
  .setup ol{margin:0 0 16px;padding-left:20px;color:var(--fg2);line-height:1.9}
  .setup code{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 6px;font:12px var(--mono);color:var(--accent-fg)}
  .err{background:var(--down-bg);border:1px solid color-mix(in srgb,var(--down) 30%,transparent);color:var(--down);
       border-radius:var(--r);padding:10px 12px;font:12px var(--mono);margin-bottom:16px;white-space:pre-wrap;word-break:break-word}

  table{width:100%;border-collapse:separate;border-spacing:0}
  thead th{position:sticky;top:0;background:var(--bg1);border-bottom:1px solid var(--line-strong);padding:8px 12px;text-align:right;font-size:11px;font-weight:600;color:var(--fg2);letter-spacing:.01em}
  thead th:first-child,thead th:nth-child(2){text-align:left}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line2);font-size:12.5px;text-align:right}
  tbody td:first-child,tbody td:nth-child(2){text-align:left}
  tbody tr:hover td{background:var(--bg-hover)}
  .sym{font:600 12px/1 var(--mono)}
  .group{margin-bottom:32px}
  .group-head{margin-bottom:12px}
  .group-head h3{margin:0;font-size:13px;font-weight:650;color:var(--fg2)}
  .up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
  .load{padding:60px 20px;text-align:center;color:var(--fg3)}
  .totals{display:flex;gap:24px;margin:18px 0 22px;flex-wrap:wrap}
  .tot-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px;min-width:150px}
  .tot-card .k{font:600 9.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin-bottom:7px}
  .tot-card .v{font-size:19px;font-weight:650}
</style>
</head>
<body>
<header>
  <a class="logo" href="/"><span>Alex</span><small>Home</small></a>
  <div class="grow"></div>
  <a class="btn" href="/screener">Stock Screener</a>
</header>
<main>
  <h1>Portfolio<span class="badge-local">Local only</span></h1>
  <p class="sub">Your real moomoo positions, read directly from your own machine via moomoo's official OpenD gateway. Nothing here can place a trade — this only ever reads your position list.</p>
  <div id="body"><div class="load">Connecting…</div></div>
</main>

<script>
"use strict";
function fmtNum(v, d){
  if (v == null || isNaN(v)) return '–';
  return Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtPct(v){
  if (v == null || isNaN(v)) return '–';
  const n = Number(v);
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}
function sgn(v){ return v == null || isNaN(v) ? '' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat'; }
function el(t, c, txt){ const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; }

function renderSetup(err){
  const body = document.getElementById('body');
  body.innerHTML = '';
  const wrap = el('div', 'setup');
  wrap.appendChild(el('h2', null, 'Not connected'));
  if (err) wrap.appendChild(el('div', 'err', err));
  const ol = el('ol');
  [
    'Install the SDK on this machine:  pip install futu-api',
    'Download moomoo’s official OpenD gateway from moomoo and sign in to your account inside it',
    'Leave OpenD running (default port 11111), then reload this page',
  ].forEach(step => { const li = el('li'); li.textContent = step; ol.appendChild(li); });
  wrap.appendChild(ol);
  const retry = el('button', 'btn', '↻ Retry');
  retry.onclick = load;
  wrap.appendChild(retry);
  body.appendChild(wrap);
}

function renderGroup(label, positions){
  const wrap = el('div', 'group');
  const head = el('div', 'group-head');
  head.appendChild(el('h3', null, label));
  wrap.appendChild(head);

  let totalValue = 0, totalPl = 0;
  positions.forEach(p => { totalValue += p.marketValue || 0; totalPl += p.pl || 0; });
  const totals = el('div', 'totals');
  const mk = (lbl, val, cls) => {
    const c = el('div', 'tot-card');
    c.appendChild(el('div', 'k', lbl));
    c.appendChild(el('div', 'v' + (cls ? ' ' + cls : ''), val));
    return c;
  };
  totals.appendChild(mk('Market value', '$' + fmtNum(totalValue, 2)));
  totals.appendChild(mk('Total P&L', (totalPl >= 0 ? '+$' : '-$') + fmtNum(Math.abs(totalPl), 2), sgn(totalPl)));
  wrap.appendChild(totals);

  const table = el('table');
  const thead = el('thead');
  const htr = el('tr');
  ['Symbol', 'Name', 'Qty', 'Cost', 'Price', 'Mkt Value', 'P&L', 'P&L %'].forEach(h => htr.appendChild(el('th', null, h)));
  thead.appendChild(htr); table.appendChild(thead);
  const tbody = el('tbody');
  positions.forEach(p => {
    const tr = el('tr');
    tr.appendChild(el('td', 'sym', p.symbol || '–'));
    tr.appendChild(el('td', null, p.name || ''));
    tr.appendChild(el('td', null, fmtNum(p.qty, 0)));
    tr.appendChild(el('td', null, fmtNum(p.costPrice, 2)));
    tr.appendChild(el('td', null, fmtNum(p.price, 2)));
    tr.appendChild(el('td', null, fmtNum(p.marketValue, 2)));
    tr.appendChild(el('td', sgn(p.pl), fmtNum(p.pl, 2)));
    tr.appendChild(el('td', sgn(p.plPct), fmtPct(p.plPct)));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function renderPositions(positions){
  const body = document.getElementById('body');
  body.innerHTML = '';
  if (!positions.length){
    body.appendChild(el('div', 'load', 'No open positions.'));
    return;
  }
  // Real and paper money are never summed together — mixing them into one
  // total would misrepresent how much is actually at risk.
  [['REAL', 'Real'], ['SIMULATE', 'Paper']].forEach(([env, label]) => {
    const rows = positions.filter(p => p.env === env);
    if (rows.length) body.appendChild(renderGroup(label, rows));
  });
  const other = positions.filter(p => p.env !== 'REAL' && p.env !== 'SIMULATE');
  if (other.length) body.appendChild(renderGroup('Other', other));
}

async function load(){
  document.getElementById('body').innerHTML = '<div class="load">Connecting…</div>';
  try {
    const r = await fetch('/api/positions');
    const d = await r.json();
    if (!d.connected) renderSetup(d.error || 'Not connected.');
    else renderPositions(d.positions || []);
  } catch(e){
    renderSetup('Request failed: ' + e.message);
  }
}
load();
</script>
</body>
</html>
