<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<title>Alex</title>
<style>
  :root{
    --bg:#0a0c11; --bg1:#0e1116; --bg2:#12151c; --bg3:#181c25;
    --line:#1f2531; --line-strong:#2b3340;
    --fg:#e8ebf1; --fg2:#98a1b3; --fg3:#5f6a7d;
    --accent:#5b93f6; --accent-fg:#d7e6ff;
    --r:6px; --r-lg:10px;
    --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --mono:"Cascadia Code","Cascadia Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased;
       display:flex;align-items:center;justify-content:center;min-height:100%}
  .card{width:min(340px,90vw);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px}
  .logo{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:650;letter-spacing:-.01em;margin-bottom:4px}
  .logo::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px -1px var(--accent)}
  .sub{margin:0 0 22px;color:var(--fg3);font-size:12.5px}
  label{display:block;font-size:11.5px;color:var(--fg2);margin-bottom:6px;font-weight:600}
  .field{margin-bottom:14px}
  input{width:100%;height:38px;padding:0 12px;background:var(--bg1);border:1px solid var(--line);border-radius:var(--r);
        color:var(--fg);font-size:13px;font-family:var(--font)}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;height:40px;margin-top:6px;background:var(--accent);border:1px solid var(--accent);color:#fff;
         border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:default}
  .err{margin-top:14px;background:rgba(240,95,107,.14);border:1px solid rgba(240,95,107,.3);color:#f0a0a8;
       border-radius:var(--r);padding:9px 11px;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Alex</div>
  <p class="sub">Sign in to continue.</p>
  <form id="loginForm">
    <div class="field">
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password">
    </div>
    <button type="submit" id="submitBtn">Sign in</button>
  </form>
  <div class="err" id="err" hidden></div>
</div>
<script>
"use strict";
var form = document.getElementById('loginForm');
var btn = document.getElementById('submitBtn');
var err = document.getElementById('err');

form.addEventListener('submit', function(e){
  e.preventDefault();
  var username = document.getElementById('u').value;
  var password = document.getElementById('p').value;
  btn.disabled = true; btn.textContent = 'Signing in...';
  err.hidden = true;
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username, password: password })
  }).then(function(r){ return r.json().then(function(d){ return { status: r.status, body: d }; }); })
    .then(function(res){
      if (res.body && res.body.ok){
        var params = new URLSearchParams(window.location.search);
        var next = params.get('next') || '/';
        window.location.href = next;
      } else {
        btn.disabled = false; btn.textContent = 'Sign in';
        err.hidden = false;
        err.textContent = (res.body && res.body.error) || 'Sign in failed.';
      }
    }).catch(function(e){
      btn.disabled = false; btn.textContent = 'Sign in';
      err.hidden = false;
      err.textContent = 'Request failed: ' + e.message;
    });
});
</script>
</body>
</html>
