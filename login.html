<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<title>Alex</title>
<style>
  :root{
    --bg:#0a0c11; --bg1:#0e1116; --bg2:#12151c; --bg3:#181c25;
    --line:#1f2531; --line-strong:#2b3340;
    --fg:#e8ebf1; --fg2:#98a1b3; --fg3:#5f6a7d;
    --accent:#5b93f6; --accent-fg:#d7e6ff;
    --r:6px; --r-lg:10px;
    --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --mono:"Cascadia Code","Cascadia Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased;
       display:flex;align-items:center;justify-content:center;min-height:100%}
  .card{width:min(340px,90vw);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px}
  .logo{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:650;letter-spacing:-.01em;margin-bottom:4px}
  .logo::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px -1px var(--accent)}
  .sub{margin:0 0 22px;color:var(--fg3);font-size:12.5px}
  label{display:block;font-size:11.5px;color:var(--fg2);margin-bottom:6px;font-weight:600}
  .field{margin-bottom:14px}
  input{width:100%;height:38px;padding:0 12px;background:var(--bg1);border:1px solid var(--line);border-radius:var(--r);
        color:var(--fg);font-size:13px;font-family:var(--font)}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;height:40px;margin-top:6px;background:var(--accent);border:1px solid var(--accent);color:#fff;
         border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:default}
  .err{margin-top:14px;background:rgba(240,95,107,.14);border:1px solid rgba(240,95,107,.3);color:#f0a0a8;
       border-radius:var(--r);padding:9px 11px;font-size:12px}
  .google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:40px;
              background:#fff;border:1px solid var(--line);border-radius:var(--r);color:#3c4043;
              font-size:13px;font-weight:600;text-decoration:none;box-sizing:border-box}
  .google-btn:hover{background:#f6f6f6}
  .divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--fg3);font-size:11px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Alex</div>
  <p class="sub">No account needed — just sign in with Google below.</p>
  <a class="google-btn" id="googleBtn" href="#">
    <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.5 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.3-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.5 3.5 24 3.5c-7.7 0-14.4 4.3-17.7 10.6z"/><path fill="#4CAF50" d="M24 44.5c5.4 0 10.3-1.9 14.1-5.3l-6.5-5.5c-2.1 1.5-4.8 2.4-7.6 2.4-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 39.9 16.2 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.7l6.5 5.5C41.4 36 44.5 30.5 44.5 24c0-1.2-.1-2.4-.9-3.5z"/></svg>
    Sign in with Google
  </a>
  <div class="divider"><span>owner login</span></div>
  <form id="loginForm">
    <div class="field">
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username">
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password">
    </div>
    <button type="submit" id="submitBtn">Sign in</button>
  </form>
  <div class="err" id="err" hidden></div>
</div>
<script>
"use strict";
var form = document.getElementById('loginForm');
var btn = document.getElementById('submitBtn');
var err = document.getElementById('err');
var params = new URLSearchParams(window.location.search);
var nextPath = params.get('next') || '/';

document.getElementById('googleBtn').href = '/api/auth/google/start?next=' + encodeURIComponent(nextPath);

var initialError = params.get('error');
if (initialError){ err.hidden = false; err.textContent = initialError; }

form.addEventListener('submit', function(e){
  e.preventDefault();
  var username = document.getElementById('u').value;
  var password = document.getElementById('p').value;
  btn.disabled = true; btn.textContent = 'Signing in...';
  err.hidden = true;
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username, password: password })
  }).then(function(r){ return r.json().then(function(d){ return { status: r.status, body: d }; }); })
    .then(function(res){
      if (res.body && res.body.ok){
        var params = new URLSearchParams(window.location.search);
        var next = params.get('next') || '/';
        window.location.href = next;
      } else {
        btn.disabled = false; btn.textContent = 'Sign in';
        err.hidden = false;
        err.textContent = (res.body && res.body.error) || 'Sign in failed.';
      }
    }).catch(function(e){
      btn.disabled = false; btn.textContent = 'Sign in';
      err.hidden = false;
      err.textContent = 'Request failed: ' + e.message;
    });
});
</script>
</body>
</html>
